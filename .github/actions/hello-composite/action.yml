name: Hello Composite
description: Tiny composite action (no network inbound; runs on the job runner)
inputs:
  message:
    description: Message to echo
    required: false
    default: complex-fixture
runs:
  using: composite
  steps:
    - name: Echo
      shell: bash
      run: |
        echo "::notice::${{ inputs.message }}"
        echo "composite_ok=true" >> "$GITHUB_OUTPUT"
